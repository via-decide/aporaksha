<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creators — Aporaksha</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@400;600&display=swap">
<style>body{margin:0;background:#0b0c10;color:#f5f5f5;font:16px Outfit,sans-serif}.wrap{max-width:1050px;margin:auto;padding:64px 24px}h1{font:700 46px 'Space Grotesk';margin:0 0 10px}.accent{color:#ff671f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:42px}.card{padding:25px;border:1px solid #292b33;border-radius:16px;background:#121319}.card h2{margin:0 0 10px}.card p{color:#aaa;line-height:1.55;min-height:74px}.card a{display:inline-block;color:#fff;background:#ff671f;text-decoration:none;border-radius:8px;padding:10px 17px;font-weight:700}</style></head>
<body><main class="wrap"><h1>Meet our <span class="accent">creators</span></h1><p>Research, expertise, and direct access from independent builders.</p><section class="grid" id="creators"></section></main>
<script>const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));fetch('/api/creator-commerce/creators').then(r=>r.json()).then(({creators})=>{document.querySelector('#creators').innerHTML=creators.map(c=>`<article class="card"><h2>${esc(c.displayName)}</h2><p>${esc(c.bio)}</p><a href="/@${encodeURIComponent(c.handle)}">View offers →</a></article>`).join('')})</script></body></html>
