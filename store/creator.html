<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator — Aporaksha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>body{margin:0;background:#0b0c10;color:#f7f7f7;font:16px Outfit,sans-serif}.wrap{max-width:920px;margin:auto;padding:55px 22px}.back{color:#ff671f;text-decoration:none}.hero{padding:45px 0 30px;border-bottom:1px solid #292b33}.hero h1{font:700 48px 'Space Grotesk';margin:10px 0}.hero p,.desc{color:#aaa;line-height:1.6}.grid{display:grid;gap:16px;margin-top:30px}.offer{border:1px solid #292b33;background:#121319;border-radius:16px;padding:24px}.row{display:flex;gap:20px;align-items:start;justify-content:space-between}.offer h2{margin:0 0 8px}.price{color:#ff671f;font:600 17px 'JetBrains Mono';white-space:nowrap}.buy{border:0;border-radius:8px;background:#ff671f;color:white;padding:11px 20px;font:700 15px Outfit;cursor:pointer}.buyer{display:none;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:18px}.buyer.open{display:grid}.buyer input{min-width:0;border:1px solid #393b45;background:#0b0c10;color:white;border-radius:8px;padding:11px}.schedule{display:contents}.confirmation{background:#102719;border:1px solid #238447;color:#9aefb2;border-radius:12px;padding:18px;margin:24px 0}.confirmation a{color:#9aefb2;font-weight:700}.error{color:#ff9470;margin-top:12px}.form-error{grid-column:1/-1;margin:0}@media(max-width:620px){.buyer{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head>
<body><main class="wrap"><a class="back" href="/store">← All creators</a><header class="hero" id="hero"></header><div id="notice"></div><section class="grid" id="offers"></section></main>
<script>
const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const pendingPaidOrders=new WeakMap();
function safeDownloadUrl(value){try{const url=new URL(value);return url.protocol==='https:'?url.href:null}catch{return null}}
const handle=new URLSearchParams(location.search).get('handle')||location.pathname.slice(2);let creator;
function tokenProfile(){let session={};try{session=JSON.parse(localStorage.getItem('aporaksha_session')||'{}')}catch{}const token=localStorage.getItem('via_access_token')||localStorage.getItem('zayvora_token')||session.accessToken;if(!token)return{email:session.email||''};try{const p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return{name:p.name||p.displayName||'',email:p.email||session.email||''}}catch{return{email:session.email||''}}}
function loadRazorpay(){if(window.Razorpay)return Promise.resolve();return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://checkout.razorpay.com/v1/checkout.js';script.onload=resolve;script.onerror=()=>reject(new Error('Could not load secure checkout'));document.body.appendChild(script)})}
function confirmed(title,delivery){let details=' Your order is complete.';if(delivery?.type==='digital_file'){const downloadUrl=safeDownloadUrl(delivery.downloadUrl);details=downloadUrl?` Your order is complete. <a href="${esc(downloadUrl)}" download rel="noopener noreferrer">${esc(delivery.fileLabel||'Download your file')}</a>`:' Your order is complete. The download link is unavailable; contact support for access.'}else if(delivery?.type==='session')details=` Your session is booked for ${esc(delivery.scheduledDate)} at ${esc(delivery.scheduledTime)}.`;document.querySelector('#notice').innerHTML=`<div class="confirmation"><strong>Confirmed!</strong> ${esc(title)}.${details}</div>`;scrollTo({top:0,behavior:'smooth'})}
async function getFulfillment(orderId){const response=await fetch(`/api/creator-commerce/fulfillment/${encodeURIComponent(orderId)}`),data=await response.json();if(!response.ok)throw new Error(data.error||'Could not retrieve order fulfillment');return data}
async function purchase(offer,form){const name=form.querySelector('[name=name]').value.trim(),email=form.querySelector('[name=email]').value.trim(),button=form.querySelector('button[type=submit]'),error=form.querySelector('.form-error');const selectedDate=form.querySelector('[name=selectedDate]')?.value||'',selectedTime=form.querySelector('[name=selectedTime]')?.value||'';button.disabled=true;button.textContent='Please wait…';error.textContent='';const pendingPaidOrder=pendingPaidOrders.get(form);if(pendingPaidOrder){try{await pendingPaidOrder();pendingPaidOrders.delete(form)}catch(err){error.textContent=`${err.message}. Your payment was received; retry confirmation without paying again.`}finally{button.disabled=false;button.textContent=pendingPaidOrders.has(form)?'Retry confirmation':'Continue'}return}
 try{const orderResponse=await fetch('/api/creator-commerce/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({creatorHandle:creator.handle,offerId:offer.offerId,buyerName:name,buyerEmail:email,selectedDate,selectedTime,idempotencyKey:`${offer.offerId}-${Date.now()}`})}),order=await orderResponse.json();if(!orderResponse.ok)throw new Error(order.error||'Could not create order');
 if(order.amountMinor===0){confirmed(offer.title,await getFulfillment(order.orderId));return}const configResponse=await fetch('/api/creator-commerce/config'),config=await configResponse.json();if(!configResponse.ok)throw new Error(config.error||'Could not load payment configuration');await loadRazorpay();
 new Razorpay({key:config.razorpayKeyId,amount:order.amountMinor,currency:order.currency,order_id:order.razorpayOrderId,name:creator.displayName,description:offer.title,prefill:{name,email},handler:async response=>{button.disabled=true;button.textContent='Verifying…';const finishPaidOrder=async()=>{const verifyResponse=await fetch('/api/creator-commerce/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:order.orderId,razorpayOrderId:order.razorpayOrderId,razorpayPaymentId:response.razorpay_payment_id,razorpaySignature:response.razorpay_signature})}),verification=await verifyResponse.json();if(!verifyResponse.ok)throw new Error(verification.error||'Payment verification failed');confirmed(offer.title,await getFulfillment(order.orderId))};pendingPaidOrders.set(form,finishPaidOrder);try{await finishPaidOrder();pendingPaidOrders.delete(form)}catch(err){error.textContent=`${err.message}. Your payment was received; retry confirmation without paying again.`}finally{button.disabled=false;button.textContent=pendingPaidOrders.has(form)?'Retry confirmation':'Continue'}}}).open()}catch(err){error.textContent=`${err.message}. Please try again.`}finally{button.disabled=false;if(!pendingPaidOrders.has(form))button.textContent='Continue'}}
fetch(`/api/creator-commerce/creators/${encodeURIComponent(handle)}`).then(r=>r.json()).then(data=>{creator=data;document.title=`${data.displayName} — Aporaksha`;document.querySelector('#hero').innerHTML=`<h1>${esc(data.displayName)}</h1><p>${esc(data.bio)}</p>`;const profile=tokenProfile();document.querySelector('#offers').innerHTML=data.offers.map((o,i)=>`<article class="offer"><div class="row"><div><h2>${esc(o.title)}</h2><div class="desc">${esc(o.description)}</div></div><div class="price">${o.amountMinor===0?'Free':new Intl.NumberFormat('en-IN',{style:'currency',currency:o.currency,maximumFractionDigits:0}).format(o.amountMinor/100)}</div></div><button class="buy" data-buy="${i}">${o.amountMinor===0?'Book free':'Buy'}</button><form class="buyer" data-form="${i}"><input name="name" aria-label="Your name" placeholder="Your name" value="${esc(profile.name)}" required><input name="email" type="email" aria-label="Email address" placeholder="Email address" value="${esc(profile.email)}" required>${o.offerType==='session'?'<span class="schedule"><input name="selectedDate" type="date" aria-label="Session date" required><input name="selectedTime" type="time" aria-label="Session time" required></span>':''}<button class="buy" type="submit">Continue</button><p class="error form-error" role="alert"></p></form></article>`).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>document.querySelector(`[data-form="${b.dataset.buy}"]`).classList.toggle('open'));document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();purchase(data.offers[Number(f.dataset.form)],f)})});
</script></body></html>
