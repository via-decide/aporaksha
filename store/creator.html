<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator — Aporaksha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>body{margin:0;background:#0b0c10;color:#f7f7f7;font:16px Outfit,sans-serif}.wrap{max-width:920px;margin:auto;padding:55px 22px}.back{color:#ff671f;text-decoration:none}.hero{padding:45px 0 30px;border-bottom:1px solid #292b33}.hero h1{font:700 48px 'Space Grotesk';margin:10px 0}.hero p,.desc{color:#aaa;line-height:1.6}.grid{display:grid;gap:16px;margin-top:30px}.offer{border:1px solid #292b33;background:#121319;border-radius:16px;padding:24px}.row{display:flex;gap:20px;align-items:start;justify-content:space-between}.offer h2{margin:0 0 8px}.price{color:#ff671f;font:600 17px 'JetBrains Mono';white-space:nowrap}.buy{border:0;border-radius:8px;background:#ff671f;color:white;padding:11px 20px;font:700 15px Outfit;cursor:pointer}.buyer{display:none;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:18px}.buyer.open{display:grid}.buyer input{min-width:0;border:1px solid #393b45;background:#0b0c10;color:white;border-radius:8px;padding:11px}.confirmation{background:#102719;border:1px solid #238447;color:#9aefb2;border-radius:12px;padding:18px;margin:24px 0}.error{color:#ff9470;margin-top:12px}@media(max-width:620px){.buyer{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head>
<body><main class="wrap"><a class="back" href="/store">← All creators</a><header class="hero" id="hero"></header><div id="notice"></div><section class="grid" id="offers"></section></main>
<script>
const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const handle=new URLSearchParams(location.search).get('handle')||location.pathname.slice(2);let creator;
function tokenProfile(){const token=localStorage.getItem('access_token');if(!token)return {};try{const p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return{name:p.name||p.displayName||'',email:p.email||''}}catch{return {}}}
function loadRazorpay(){if(window.Razorpay)return Promise.resolve();return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://checkout.razorpay.com/v1/checkout.js';script.onload=resolve;script.onerror=reject;document.body.appendChild(script)})}
function confirmed(title){document.querySelector('#notice').innerHTML=`<div class="confirmation"><strong>Confirmed!</strong> Your order for ${esc(title)} is complete. Check your email for details.</div>`;scrollTo({top:0,behavior:'smooth'})}
async function purchase(offer,form){const name=form.querySelector('[name=name]').value.trim(),email=form.querySelector('[name=email]').value.trim();const button=form.querySelector('button');button.disabled=true;button.textContent='Please wait…';
 const order=await fetch('/api/creator-commerce/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({creatorHandle:creator.handle,offerId:offer.offerId,buyerName:name,buyerEmail:email,idempotencyKey:`${offer.offerId}-${Date.now()}`})}).then(r=>r.json());
 if(order.amountMinor===0){confirmed(offer.title);return}const config=await fetch('/api/creator-commerce/config').then(r=>r.json());await loadRazorpay();
 new Razorpay({key:config.razorpayKeyId,amount:order.amountMinor,currency:order.currency,order_id:order.razorpayOrderId,name:creator.displayName,description:offer.title,prefill:{name,email},handler:async response=>{await fetch('/api/creator-commerce/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:order.orderId,razorpayOrderId:order.razorpayOrderId,razorpayPaymentId:response.razorpay_payment_id,razorpaySignature:response.razorpay_signature})});confirmed(offer.title)}}).open();button.disabled=false;button.textContent='Continue';}
fetch(`/api/creator-commerce/creators/${encodeURIComponent(handle)}`).then(r=>r.json()).then(data=>{creator=data;document.title=`${data.displayName} — Aporaksha`;document.querySelector('#hero').innerHTML=`<h1>${esc(data.displayName)}</h1><p>${esc(data.bio)}</p>`;const profile=tokenProfile();document.querySelector('#offers').innerHTML=data.offers.map((o,i)=>`<article class="offer"><div class="row"><div><h2>${esc(o.title)}</h2><div class="desc">${esc(o.description)}</div></div><div class="price">${o.amountMinor===0?'Free':new Intl.NumberFormat('en-IN',{style:'currency',currency:o.currency,maximumFractionDigits:0}).format(o.amountMinor/100)}</div></div><button class="buy" data-buy="${i}">${o.amountMinor===0?'Book free':'Buy'}</button><form class="buyer" data-form="${i}"><input name="name" aria-label="Your name" placeholder="Your name" value="${esc(profile.name)}" required><input name="email" type="email" aria-label="Email address" placeholder="Email address" value="${esc(profile.email)}" required><button class="buy" type="submit">Continue</button></form></article>`).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>document.querySelector(`[data-form="${b.dataset.buy}"]`).classList.toggle('open'));document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();purchase(data.offers[Number(f.dataset.form)],f)})});
</script></body></html>
