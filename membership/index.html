<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership — Aporaksha</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap"><style>body{margin:0;background:#0b0c10;color:#fff;font:17px Outfit,sans-serif}.card{max-width:570px;margin:12vh auto;padding:44px;border:1px solid #30323a;border-radius:20px;background:#121319}h1{font:700 44px 'Space Grotesk';margin:0}.accent{color:#ff671f}p{color:#aaa;line-height:1.6}button{background:#ff671f;color:#fff;border:0;border-radius:9px;padding:13px 22px;font-weight:700;cursor:pointer}</style></head><body><main class="card"><h1>Become a <span class="accent">member</span></h1><p>Support independent intelligence and unlock the complete Aporaksha membership library.</p><button id="subscribe">Subscribe</button><p id="status"></p></main><script>
const token=localStorage.getItem('access_token');function payload(){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}function loadRazorpay(){if(window.Razorpay)return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=resolve;s.onerror=reject;document.body.appendChild(s)})}
document.querySelector('#subscribe').onclick=async()=>{const status=document.querySelector('#status');status.textContent='Opening secure checkout…';const data=await fetch('/api/membership/subscribe',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({email:payload().email})}).then(r=>r.json());if(data.shortUrl){window.location.href=data.shortUrl;return}if(data.subscriptionId){const config=await fetch('/api/creator-commerce/config').then(r=>r.json());await loadRazorpay();new Razorpay({key:config.razorpayKeyId,subscription_id:data.subscriptionId,name:'Aporaksha Membership',handler:()=>location.reload()}).open()}};
</script></body></html>
