<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership — Aporaksha</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap"><style>body{margin:0;background:#0b0c10;color:#fff;font:17px Outfit,sans-serif}.card{max-width:570px;margin:12vh auto;padding:44px;border:1px solid #30323a;border-radius:20px;background:#121319}h1{font:700 44px 'Space Grotesk';margin:0}.accent{color:#ff671f}p{color:#aaa;line-height:1.6}.email{display:block;box-sizing:border-box;width:100%;margin:20px 0 12px;border:1px solid #393b45;background:#0b0c10;color:#fff;border-radius:9px;padding:13px}button{background:#ff671f;color:#fff;border:0;border-radius:9px;padding:13px 22px;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{color:#ff9470}</style></head><body><main class="card"><h1>Become a <span class="accent">member</span></h1><p>Support independent intelligence and unlock the complete Aporaksha membership library.</p><input class="email" id="email" type="email" aria-label="Email address" placeholder="Email address" required><button id="subscribe">Subscribe</button><p id="status" role="status"></p></main><script>
function auth(){let session={};try{session=JSON.parse(localStorage.getItem('aporaksha_session')||'{}')}catch{}const token=localStorage.getItem('via_access_token')||localStorage.getItem('zayvora_token')||session.accessToken||'';return{token,session}}
function payload(token){if(!token)return {};try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}
function loadRazorpay(){if(window.Razorpay)return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load secure checkout'));document.body.appendChild(s)})}
const credentials=auth();document.querySelector('#email').value=payload(credentials.token).email||credentials.session.email||'';
document.querySelector('#subscribe').onclick=async()=>{const status=document.querySelector('#status'),button=document.querySelector('#subscribe'),emailInput=document.querySelector('#email'),email=emailInput.value.trim();emailInput.value=email;status.className='';if(!emailInput.checkValidity()){status.className='error';status.textContent=email?'Enter a valid email address for your membership.':'Enter the email address for your membership.';emailInput.reportValidity();return}button.disabled=true;status.textContent='Opening secure checkout…';try{const response=await fetch('/api/membership/subscribe',{method:'POST',headers:{Authorization:`Bearer ${credentials.token}`,'Content-Type':'application/json'},body:JSON.stringify({email})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to start membership checkout');if(data.shortUrl){window.location.href=data.shortUrl;return}if(!data.subscriptionId)throw new Error('Checkout did not return a subscription');const configResponse=await fetch('/api/creator-commerce/config'),config=await configResponse.json();if(!configResponse.ok)throw new Error(config.error||'Unable to load payment configuration');await loadRazorpay();new Razorpay({key:config.razorpayKeyId,subscription_id:data.subscriptionId,name:'Aporaksha Membership',handler:()=>location.reload()}).open()}catch(error){status.className='error';status.textContent=`${error.message}. Please try again.`}finally{button.disabled=false}};
</script></body></html>
