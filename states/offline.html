<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>No Internet — Aporaksha.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="min-h-screen bg-[#0b0c10] text-[#f5f5f5] antialiased">
<header class="border-b border-[#1e293b] bg-[#0b0c10]/90 backdrop-blur sticky top-0 z-50">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
    <a href="/states/index" class="text-xs font-mono text-[#94a3b8] hover:text-[#ff671f] flex items-center gap-1.5 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Infrastructure States
    </a>
    <span class="font-mono text-xs text-[#fbbf24]">State 04 / Air-Gapped Offline</span>
  </div>
</header>
<main class="mx-auto max-w-2xl px-4 py-20 text-center">
  <div class="inline-flex h-20 w-20 items-center justify-center rounded-2xl border border-[#fbbf24]/30 bg-[#fbbf24]/10 mb-6 text-[#fbbf24]">
    <i data-lucide="shield-alert" class="w-10 h-10"></i>
  </div>
  <h1 class="text-2xl font-bold text-white mb-2">Air-Gapped Sovereign Node Active</h1>
  <p class="text-[#94a3b8] text-sm max-w-md mx-auto mb-8 leading-relaxed">
    External network uplink disconnected. Aporaksha node is running in isolated air-gapped mode — on-premise AI inference remains operational.
  </p>

  <div class="mx-auto max-w-sm rounded-xl border border-[#1e293b] bg-[#121826] p-4 text-left font-mono text-xs space-y-2 mb-8">
    <div class="flex justify-between items-center text-white">
      <span class="flex items-center gap-2"><i data-lucide="cpu" class="w-4 h-4 text-[#ff671f]"></i> Local Weights</span>
      <span class="text-[#34d399]">Loaded (70B Model)</span>
    </div>
    <div class="flex justify-between items-center text-[#94a3b8]">
      <span>Global Control Sync</span>
      <span class="text-[#fbbf24]">Isolated</span>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-3">
    <button onclick="window.location.reload()" class="inline-flex items-center gap-2 rounded-lg bg-[#ff671f] px-4 py-2.5 text-sm font-semibold text-[#120b08] hover:bg-[#ff8547] transition-colors">
      <i data-lucide="radio" class="w-4 h-4"></i> Probe Control Plane Link
    </button>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
