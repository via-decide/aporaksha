<!doctype html>

<body class="min-h-screen bg-[#0b0c10] text-[#f5f5f5] antialiased">

    <span class="font-mono text-xs text-[#fbbf24]">State 08 / Session Expired</span>

  <div class="rounded-xl border border-[#1e293b] bg-[#121826] p-6 shadow-2xl text-center">
